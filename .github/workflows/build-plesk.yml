# Compila l'app su GitHub e pubblica il risultato pronto nel branch `production` (sola lettura).
# Plesk scarica quel branch con Git: niente build sul server (VPS da 2 GB).
#
#   main  →  build  →  branch `production`  →  Plesk: Estrai ora + Riavvia app

name: Build per Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-plesk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dipendenze
        run: npm ci --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Assembla il pacchetto standalone
        run: |
          mkdir dist
          cp -r .next/standalone/. dist/
          mkdir -p dist/.next
          cp -r .next/static dist/.next/static
          cp -r public dist/public
          rm -rf dist/drizzle && cp -r drizzle dist/drizzle
          # Il .env non c'è: le variabili si impostano nell'app Node.js di Plesk
          rm -f dist/.env*
          cat > dist/README.md <<'MD'
          # golduck-marketing · build di produzione
          Generato da GitHub Actions dal branch `main` (commit ${{ github.sha }}).
          Non modificare: ogni push su `main` sovrascrive questo branch.
          Avvio: `node server.js` (in Plesk: file di avvio `server.js`).
          MD

      - name: Pubblica sul branch production
        run: |
          cd dist
          git init -q -b production
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -q -m "Build di produzione da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" production
